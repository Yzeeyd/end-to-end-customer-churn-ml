name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


env:
  GHCR_IMAGE: ghcr.io/yzeeyd/end-to-end-customer-churn-ml


jobs:

  # =========================================================
  # 1. TESTS
  # =========================================================
  test-and-build:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest -v


  # =========================================================
  # 2. DOCKER
  # =========================================================
  docker:
    name: Docker
    runs-on: ubuntu-latest

    environment: Deployment Release

    needs:
      - test-and-build
    
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:

      # -----------------------------------------------------
      # Checkout
      # -----------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v6


      # -----------------------------------------------------
      # Docker Buildx
      # -----------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4


      # =====================================================
      # PULL REQUEST
      # Build only
      # =====================================================
      - name: Build Docker image for PR
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: end-to-end-customer-churn-ml:pr-test
          cache-from: type=gha
          cache-to: type=gha,mode=max


      # =====================================================
      # MAIN BRANCH ONLY
      # =====================================================

      # -----------------------------------------------------
      # Login to GitHub Container Registry
      # -----------------------------------------------------
      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # -----------------------------------------------------
      # AWS Authentication using GitHub OIDC
      # -----------------------------------------------------
      - name: Configure AWS credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}


      # -----------------------------------------------------
      # Login to Amazon ECR
      # -----------------------------------------------------
      - name: Login to Amazon ECR
        if: github.event_name == 'push'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # -----------------------------------------------------
      # Generate tags for BOTH GHCR and ECR
      # -----------------------------------------------------
      - name: Generate Docker metadata
        if: github.event_name == 'push'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}

          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

          labels: |
            org.opencontainers.image.title=end-to-end-customer-churn-ml
            org.opencontainers.image.description=End-to-end customer churn machine learning API
            org.opencontainers.image.source=https://github.com/Yzeeyd/end-to-end-customer-churn-ml
            org.opencontainers.image.revision=${{ github.sha }}


      # -----------------------------------------------------
      # BUILD ONCE + PUSH TO BOTH REGISTRIES
      # -----------------------------------------------------
      - name: Build and push Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max