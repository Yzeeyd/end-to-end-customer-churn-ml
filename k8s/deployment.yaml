apiVersion: apps/v1
kind: Deployment

metadata:
  name: churn-api
  namespace: churn-ml

  labels:
    app: churn-api

spec:
  
  replicas: 4
  
  strategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 0
        maxSurge: 2

  selector:
    matchLabels:
      app: churn-api

  template:
    metadata:
      labels:
        app: churn-api

    spec:
      containers:
        - name: churn-api
          image: ghcr.io/yzeeyd/end-to-end-customer-churn-ml:latest
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 8000

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            
            limits:
              cpu: "500m"
              memory: "512Mi"
          
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3