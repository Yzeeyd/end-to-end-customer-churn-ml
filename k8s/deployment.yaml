apiVersion: apps/v1
kind: Deployment

metadata:
  name: churn-api

spec:
  replicas: 3

  selector:
    matchLabels:
      app: churn-api

  template:
    metadata:
      labels:
        app: churn-api

    spec:
      containers:
        - name: churn-api
          image: churn-api:1.3-bad
          imagePullPolicy: Never

          ports:
            - containerPort: 8000

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20